<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none" role="img" aria-label="Smart Energy and Grid Monitor IoT Device">
  <defs>
    <linearGradient id="meter-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="#0C1322" rx="12" />
  
  <!-- Digital Oscilloscope Screen -->
  <rect x="30" y="35" width="220" height="130" rx="8" fill="#020617" stroke="#38BDF8" stroke-width="1.8" />
  
  <!-- Grid Lines inside screen -->
  <line x1="30" y1="100" x2="250" y2="100" stroke="#1E293B" stroke-width="1" />
  <line x1="30" y1="67" x2="250" y2="67" stroke="#0F172A" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="30" y1="133" x2="250" y2="133" stroke="#0F172A" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="85" y1="35" x2="85" y2="165" stroke="#0F172A" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="140" y1="35" x2="140" y2="165" stroke="#1E293B" stroke-width="1" />
  <line x1="195" y1="35" x2="195" y2="165" stroke="#0F172A" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Smooth Sine Wave Power Curve -->
  <path d="M 30 100 Q 55 50 85 100 T 140 100 T 195 100 T 250 100" stroke="url(#wave-grad)" stroke-width="2.5" fill="none" stroke-linecap="round" />
  
  <!-- Screen Readouts -->
  <text x="40" y="55" font-family="monospace" font-size="10" fill="#00F2FE" font-weight="700">V_RMS: 231.4V</text>
  <text x="140" y="55" font-family="monospace" font-size="10" fill="#10B981" font-weight="700">FREQ: 50.02 Hz</text>
  <text x="40" y="150" font-family="monospace" font-size="9" fill="#94A3B8">P_ACTIVE: 642.8 W • PF: 0.98</text>

  <!-- Current Sensor Module & Cable (ACS712 CT Clamp) on Right -->
  <rect x="270" y="45" width="105" height="150" rx="8" fill="url(#meter-grad)" stroke="#334155" stroke-width="1.5" />
  <text x="282" y="68" font-family="system-ui, sans-serif" font-size="11" fill="#FFFFFF" font-weight="700">ESP32 IOT CORE</text>
  
  <!-- Current Clamp Ring -->
  <circle cx="322" cy="115" r="24" stroke="#F59E0B" stroke-width="6" fill="none" />
  <line x1="322" y1="75" x2="322" y2="155" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
  <text x="288" y="158" font-family="monospace" font-size="9" fill="#F59E0B">ACS712 SENSOR</text>

  <!-- Live Status LED -->
  <circle cx="355" cy="65" r="3" fill="#10B981" />
  <text x="280" y="180" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">● MQTT CONNECTED</text>
  
  <!-- Bottom Bar with Total Energy -->
  <rect x="30" y="180" width="220" height="35" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="40" y="202" font-family="system-ui, sans-serif" font-size="11" fill="#F8FAFC">Cumulative Energy: <tspan fill="#38BDF8" font-weight="700">4.18 kWh</tspan></text>
</svg>
