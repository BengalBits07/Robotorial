<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none" role="img" aria-label="Gesture Controlled Robotic Arm System">
  <defs>
    <linearGradient id="arm-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="claw-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="#0C1322" rx="12" />
  
  <!-- Base Turntable -->
  <ellipse cx="250" cy="205" rx="50" ry="16" fill="#1E293B" stroke="#00F2FE" stroke-width="2" />
  <rect x="235" y="180" width="30" height="25" fill="#334155" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="250" cy="180" r="8" fill="#A855F7" />

  <!-- Link 1 (Shoulder to Elbow) -->
  <line x1="250" y1="180" x2="200" y2="105" stroke="#64748B" stroke-width="14" stroke-linecap="round" />
  <line x1="250" y1="180" x2="200" y2="105" stroke="#38BDF8" stroke-width="2" />

  <!-- Elbow Joint Servo -->
  <circle cx="200" cy="105" r="10" fill="#0284C7" stroke="#00F2FE" stroke-width="2" />
  <circle cx="200" cy="105" r="3" fill="#FFFFFF" />

  <!-- Link 2 (Elbow to Wrist) -->
  <line x1="200" y1="105" x2="270" y2="70" stroke="#475569" stroke-width="10" stroke-linecap="round" />
  
  <!-- Wrist Joint Servo -->
  <circle cx="270" cy="70" r="7" fill="#A855F7" stroke="#C084FC" stroke-width="1.5" />

  <!-- Gripper Claw (Two Prongs) -->
  <path d="M 270 70 Q 295 55 310 65" stroke="url(#claw-glow)" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 270 70 Q 295 85 310 75" stroke="url(#claw-glow)" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Held Object (Glowing sphere) -->
  <circle cx="305" cy="70" r="7" fill="#00F2FE" opacity="0.8" />

  <!-- Sensory Glove Diagram on Left Side -->
  <rect x="35" y="60" width="105" height="135" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <text x="45" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#A855F7" font-weight="700">GESTURE GLOVE</text>
  
  <!-- Glove Hand shape -->
  <path d="M 60 160 L 60 120 L 70 100 L 80 100 L 85 125 L 90 98 L 98 98 L 102 125 L 106 104 L 114 104 L 118 135 L 118 160 Z" stroke="#64748B" stroke-width="1.5" fill="#0F172A" />
  
  <!-- MPU6050 Accelerometer/Gyro Sensor on back of hand -->
  <rect x="75" y="130" width="22" height="18" rx="2" fill="#0284C7" stroke="#00F2FE" stroke-width="1" />
  <circle cx="86" cy="139" r="2" fill="#FFFFFF" />
  <text x="45" y="180" font-family="system-ui, sans-serif" font-size="9" fill="#00F2FE">MPU6050 6-DOF IMU</text>

  <!-- Wireless Link RF wave -->
  <path d="M 145 100 Q 170 90 190 100" stroke="#00F2FE" stroke-width="2" stroke-dasharray="3 3" fill="none" />
  <text x="142" y="85" font-family="monospace" font-size="9" fill="#00F2FE">NRF24L01 2.4GHz</text>
</svg>
