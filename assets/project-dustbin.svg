<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none" role="img" aria-label="Smart Dustbin Interactive Prototype Illustration">
  <defs>
    <linearGradient id="dustbin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="lid-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="sonar-glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background grid & glow -->
  <rect width="400" height="240" fill="#0C1322" rx="12" />
  <circle cx="200" cy="120" r="140" fill="#00F2FE" opacity="0.04" />
  
  <!-- Circuit tracks on PCB plane -->
  <path d="M 40 180 L 120 180 L 150 210 M 280 210 L 310 180 L 360 180" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="40" cy="180" r="3" fill="#00F2FE" />
  <circle cx="360" cy="180" r="3" fill="#A855F7" />

  <!-- Dustbin Body (Trapezoid) -->
  <path d="M 150 110 L 250 110 L 238 215 L 162 215 Z" fill="url(#dustbin-grad)" stroke="#38BDF8" stroke-width="2" />
  <!-- Recycling/Eco Tech Symbol -->
  <path d="M 194 150 L 206 150 L 200 162 Z" fill="#00F2FE" opacity="0.8" />
  <circle cx="200" cy="165" r="14" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="3 2" fill="none" opacity="0.7" />

  <!-- Automated Lid (Tilted/Open) -->
  <g transform="rotate(-32 150 106)">
    <rect x="145" y="98" width="115" height="12" rx="4" fill="url(#lid-grad)" filter="url(#sonar-glow)" />
    <!-- Servo pivot pin -->
    <circle cx="150" cy="104" r="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
  </g>

  <!-- Ultrasonic Sensor (HC-SR04 mounted on rim) -->
  <rect x="180" y="86" width="40" height="18" rx="3" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="190" cy="95" r="6" fill="#1E293B" stroke="#E2E8F0" stroke-width="1.5" />
  <circle cx="210" cy="95" r="6" fill="#1E293B" stroke="#E2E8F0" stroke-width="1.5" />
  <circle cx="190" cy="95" r="2" fill="#00F2FE" />
  <circle cx="210" cy="95" r="2" fill="#00F2FE" />

  <!-- Ultrasonic Sonar Waves (Pulsing upwards) -->
  <path d="M 186 75 A 16 16 0 0 1 214 75" stroke="#00F2FE" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9" filter="url(#sonar-glow)">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.8s" repeatCount="indefinite" />
  </path>
  <path d="M 178 63 A 28 28 0 0 1 222 63" stroke="#38BDF8" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.8s" repeatCount="indefinite" />
  </path>
  <path d="M 170 51 A 40 40 0 0 1 230 51" stroke="#A855F7" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="1.8s" repeatCount="indefinite" />
  </path>

  <!-- Approaching Hand / Object Indicator -->
  <circle cx="200" cy="38" r="10" fill="#38BDF8" opacity="0.2" />
  <circle cx="200" cy="38" r="4" fill="#00F2FE" />
  <text x="218" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#38BDF8" font-weight="600">Proximity: 12cm</text>
  <text x="218" y="55" font-family="system-ui, sans-serif" font-size="9" fill="#10B981" font-weight="500">Status: LID_OPEN</text>
</svg>
