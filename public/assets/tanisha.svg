<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none" role="img" aria-label="Portrait of Tanisha Seal, CEO">
  <defs>
    <linearGradient id="avatar-bg-tanisha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="ring-tanisha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <clipPath id="circle-clip-t">
      <circle cx="80" cy="80" r="70" />
    </clipPath>
  </defs>

  <!-- Outer Glowing Tech Ring -->
  <circle cx="80" cy="80" r="76" stroke="url(#ring-tanisha)" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.85" />
  <circle cx="80" cy="80" r="70" fill="url(#avatar-bg-tanisha)" />

  <g clip-path="url(#circle-clip-t)">
    <!-- Circuit lines in background -->
    <path d="M 30 110 L 60 80 L 100 80 L 130 50" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="3 3" />
    <circle cx="60" cy="80" r="2.5" fill="#00F2FE" opacity="0.4" />
    <circle cx="100" cy="80" r="2.5" fill="#A855F7" opacity="0.4" />

    <!-- Shoulders & Tech Blazer -->
    <path d="M 28 160 C 28 126 50 116 80 116 C 110 116 132 126 132 160 Z" fill="#1E293B" />
    <path d="M 64 120 L 80 148 L 96 120" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.8" />
    <circle cx="80" cy="148" r="3" fill="#00F2FE" />

    <!-- Neck & Face -->
    <rect x="72" y="94" width="16" height="22" rx="4" fill="#F1B898" />
    <ellipse cx="80" cy="74" rx="26" ry="32" fill="#F8C9AD" />

    <!-- Hair (Long dark hair with sleek tech cut) -->
    <path d="M 50 72 C 48 40 62 26 80 26 C 98 26 112 40 110 72 C 114 96 114 122 110 134 C 104 124 100 106 100 94 C 100 80 104 54 94 44 C 86 36 74 36 66 44 C 56 54 60 80 60 94 C 60 106 56 124 50 134 C 46 122 46 96 50 72 Z" fill="#0F172A" />

    <!-- Modern Smart Glasses -->
    <rect x="60" y="66" width="16" height="11" rx="3" fill="none" stroke="#00F2FE" stroke-width="1.8" />
    <rect x="84" y="66" width="16" height="11" rx="3" fill="none" stroke="#00F2FE" stroke-width="1.8" />
    <line x1="76" y1="71" x2="84" y2="71" stroke="#00F2FE" stroke-width="1.8" />
    <!-- Eyes behind glasses -->
    <circle cx="68" cy="71" r="2.2" fill="#334155" />
    <circle cx="92" cy="71" r="2.2" fill="#334155" />

    <!-- Smile -->
    <path d="M 73 88 Q 80 94 87 88" stroke="#9A3412" stroke-width="1.6" stroke-linecap="round" fill="none" />
  </g>

  <!-- Status indicator dot (Leader / Online) -->
  <circle cx="126" cy="126" r="10" fill="#0B0F19" />
  <circle cx="126" cy="126" r="7" fill="#10B981" />
  <circle cx="126" cy="126" r="7" fill="#10B981" opacity="0.6">
    <animate attributeName="r" values="7;11;7" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
