  <ellipse cx="200" cy="112" rx="42" ry="54" stroke="#38BDF8" stroke-width="1.8" fill="#1E293B" opacity="0.6" />
  
  <!-- Facial bounding box with HUD corners -->
  <g stroke="#00F2FE" stroke-width="2.5" fill="none">
    <!-- Top-Left -->
    <path d="M 145 70 L 145 52 L 163 52" />
    <!-- Top-Right -->
    <path d="M 237 52 L 255 52 L 255 70" />
    <!-- Bottom-Left -->
    <path d="M 145 154 L 145 172 L 163 172" />
    <!-- Bottom-Right -->
    <path d="M 237 172 L 255 172 L 255 154" />
  </g>

  <!-- Facial mesh landmark keypoints -->
  <circle cx="185" cy="100" r="3" fill="#00F2FE" />
  <circle cx="215" cy="100" r="3" fill="#00F2FE" />
  <circle cx="200" cy="116" r="2.5" fill="#A855F7" />
  <circle cx="192" cy="134" r="2" fill="#00F2FE" />
  <circle cx="208" cy="134" r="2" fill="#00F2FE" />
  <line x1="185" y1="100" x2="200" y2="116" stroke="#00F2FE" stroke-width="1" opacity="0.6" />
  <line x1="215" y1="100" x2="200" y2="116" stroke="#00F2FE" stroke-width="1" opacity="0.6" />
  <line x1="200" y1="116" x2="192" y2="134" stroke="#A855F7" stroke-width="1" opacity="0.6" />
  <line x1="200" y1="116" x2="208" y2="134" stroke="#A855F7" stroke-width="1" opacity="0.6" />

  <!-- Verification Badge / Pill -->
  <rect x="140" y="184" width="120" height="26" rx="13" fill="#065F46" stroke="#10B981" stroke-width="1.5" />
