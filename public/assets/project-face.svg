  <path d="M 152 197 L 157 202 L 166 193" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="172" y="201" font-family="system-ui, sans-serif" font-size="11" fill="#FFFFFF" font-weight="700">VERIFIED: 99.4%</text>

  <!-- Side Telemetry Readouts -->
  <g font-family="system-ui, monospace, sans-serif" font-size="10" fill="#94A3B8">
    <text x="25" y="45" fill="#38BDF8" font-weight="700">EDGE AI CAMERA NODE</text>
    <text x="25" y="65">FPS: 32.4 (OpenCV DNN)</text>
    <text x="25" y="82">Embedding: 128-D vector</text>
    <text x="25" y="99">Match: ID# BB-STUDENT-2026</text>

    <text x="270" y="45" fill="#A855F7" font-weight="700">CLOUD SYNC</text>
    <text x="270" y="65">Status: REALTIME_ACK</text>
    <text x="270" y="82">Timestamp: 09:42:15 AM</text>
    <text x="270" y="99">Database: Synced (SQLite)</text>
  </g>
</svg>
