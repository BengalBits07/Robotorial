<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" width="340" height="60" fill="none" role="img" aria-label="Bengal Bits - Robotics & Automation Labs">
  <defs>
    <linearGradient id="bb-orange-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FA5A1E" />
    </linearGradient>
    <filter id="bb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- High-Tech Chip Node Emblem -->
  <g transform="translate(6, 10)">
    <!-- Dark Enclosure -->
    <rect x="0" y="0" width="40" height="40" rx="10" fill="#111114" stroke="#27272A" stroke-width="1.5" />
    
    <!-- Circuit Pin Tracks -->
    <path d="M 8 20 L 14 20 M 26 20 L 32 20 M 20 8 L 20 14 M 20 26 L 20 32" stroke="#FF5A00" stroke-width="2" stroke-linecap="round" />
    
    <!-- Central Core Hexagon -->
    <polygon points="20,12 27,16 27,24 20,28 13,24 13,16" fill="#1C1E22" stroke="#FF5A00" stroke-width="1.8" />
    
    <!-- Core Glowing Node -->
    <circle cx="20" cy="20" r="3" fill="#FF5A00" filter="url(#bb-glow)" />

    <!-- Corner Circuit Markers -->
    <circle cx="6" cy="6" r="1.5" fill="#9CA3AF" />
    <circle cx="34" cy="6" r="1.5" fill="#9CA3AF" />
    <circle cx="6" cy="34" r="1.5" fill="#9CA3AF" />
    <circle cx="34" cy="34" r="1.5" fill="#9CA3AF" />
  </g>

  <!-- Bold Typography: BENGAL BITS -->
  <g transform="translate(60, 14)">
    <text x="0" y="21" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.04em" fill="#111114">
      BENGAL <tspan fill="#FF5A00">BITS</tspan>
    </text>
    <text x="0" y="34" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="0.14em" text-transform="uppercase" fill="#6B7280">
      ROBOTICS &amp; AUTOMATION LABS
    </text>
  </g>
</svg>
