<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 420" width="100%" height="100%" fill="none" role="img" aria-label="Autonomous Scout Mech Robot in Gunmetal Black">
  <defs>
    <radialGradient id="robot-shadow-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="body-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3139" />
      <stop offset="50%" stop-color="#1B1E24" />
      <stop offset="100%" stop-color="#0F1115" />
    </linearGradient>
    <linearGradient id="metal-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ground Contact Shadow -->
  <ellipse cx="170" cy="385" rx="130" ry="22" fill="url(#robot-shadow-b)" />
  <ellipse cx="105" cy="385" rx="45" ry="12" fill="#000000" opacity="0.4" />
  <ellipse cx="235" cy="385" rx="45" ry="12" fill="#000000" opacity="0.4" />

  <!-- Robot Group -->
  <g transform="translate(10, 10)">
    
    <!-- Torso / Upper Head Box (Cube-like Mech Body) -->
    <rect x="75" y="80" width="170" height="140" rx="20" fill="url(#body-dark-grad)" stroke="#374151" stroke-width="2.5" />
    
    <!-- Armor plates & bolts -->
    <rect x="85" y="90" width="150" height="120" rx="14" fill="#181B20" />
    <circle cx="95" cy="100" r="3" fill="#6B7280" />
    <circle cx="225" cy="100" r="3" fill="#6B7280" />
    <circle cx="95" cy="195" r="3" fill="#6B7280" />
    <circle cx="225" cy="195" r="3" fill="#6B7280" />

    <!-- Cyan Visor Screen (LINK 7) -->
    <rect x="110" y="110" width="100" height="48" rx="8" fill="#0B132B" stroke="#00F2FE" stroke-width="1.8" />
    <!-- Visor internal glow & graphic -->
    <rect x="135" y="122" width="50" height="24" rx="4" fill="#00F2FE" filter="url(#cyan-glow)" opacity="0.9" />
    <rect x="142" y="127" width="36" height="14" rx="2" fill="#FFFFFF" opacity="0.8" />
    <!-- LINK 7 Stencil Text -->
    <text x="160" y="185" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="900" letter-spacing="0.15em" fill="#E5E7EB" text-anchor="middle">
      LINK 7
    </text>

    <!-- Side Sensor Ears & Antennae -->
    <rect x="60" y="120" width="15" height="30" rx="4" fill="#374151" />
    <rect x="245" y="120" width="15" height="30" rx="4" fill="#374151" />
    <line x1="68" y1="120" x2="68" y2="85" stroke="#4B5563" stroke-width="3" stroke-linecap="round" />
    <circle cx="68" cy="85" r="3.5" fill="#FF6B00" />

    <!-- Heavy Hip Joint / Pelvis Block -->
    <rect x="115" y="210" width="90" height="35" rx="8" fill="url(#metal-sheen)" stroke="#111827" stroke-width="2" />
    <circle cx="160" cy="227" r="8" fill="#111827" />
    <circle cx="160" cy="227" r="4" fill="#FF6B00" />

    <!-- Left Leg (Viewer's Left) -->
    <!-- Hip Pivot -->
    <circle cx="105" cy="235" r="16" fill="#1F2937" stroke="#4B5563" stroke-width="2" />
    <!-- Upper Thigh Link (Angled Outward) -->
    <path d="M 100 240 L 75 295 L 95 305 L 115 250 Z" fill="#111827" stroke="#374151" stroke-width="2" />
    <!-- Hydraulic Cylinder -->
    <line x1="110" y1="245" x2="90" y2="295" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round" />
    <!-- Knee Joint -->
    <circle cx="85" cy="300" r="14" fill="#374151" stroke="#111827" stroke-width="2" />
    <circle cx="85" cy="300" r="5" fill="#FF6B00" />
    <!-- Lower Shin Link (Angled Back In) -->
    <path d="M 85 305 L 95 365 L 115 365 L 98 305 Z" fill="#1F2937" stroke="#374151" stroke-width="2" />
    <!-- Heavy Foot / Gripper Pad -->
    <path d="M 70 375 L 125 375 L 130 365 L 85 360 Z" fill="#111827" stroke="#4B5563" stroke-width="2.5" />
    <rect x="75" y="375" width="20" height="8" rx="2" fill="#374151" />
    <rect x="105" y="375" width="20" height="8" rx="2" fill="#374151" />

    <!-- Right Leg (Viewer's Right) -->
    <!-- Hip Pivot -->
    <circle cx="215" cy="235" r="16" fill="#1F2937" stroke="#4B5563" stroke-width="2" />
    <!-- Upper Thigh Link -->
    <path d="M 220 240 L 245 295 L 225 305 L 205 250 Z" fill="#111827" stroke="#374151" stroke-width="2" />
    <!-- Hydraulic Cylinder -->
    <line x1="210" y1="245" x2="230" y2="295" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round" />
    <!-- Knee Joint -->
    <circle cx="235" cy="300" r="14" fill="#374151" stroke="#111827" stroke-width="2" />
    <circle cx="235" cy="300" r="5" fill="#FF6B00" />
    <!-- Lower Shin Link -->
    <path d="M 235 305 L 225 365 L 205 365 L 222 305 Z" fill="#1F2937" stroke="#374151" stroke-width="2" />
    <!-- Heavy Foot / Gripper Pad -->
    <path d="M 250 375 L 195 375 L 190 365 L 235 360 Z" fill="#111827" stroke="#4B5563" stroke-width="2.5" />
    <rect x="225" y="375" width="20" height="8" rx="2" fill="#374151" />
    <rect x="195" y="375" width="20" height="8" rx="2" fill="#374151" />
  </g>
</svg>
