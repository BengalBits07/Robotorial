<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none" role="img" aria-label="Bengal Bits Logo">
  <defs>
    <linearGradient id="bb-grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="bb-grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagonal Chip Icon -->
  <g transform="translate(6, 6)">
    <!-- Circuit lines -->
    <path d="M 10 24 L 2 24 M 46 24 L 38 24 M 24 10 L 24 2 M 24 46 L 24 38" stroke="url(#bb-grad-cyan)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <circle cx="2" cy="24" r="2.5" fill="#00F2FE" />
    <circle cx="46" cy="24" r="2.5" fill="#00F2FE" />
    <circle cx="24" cy="2" r="2.5" fill="#A855F7" />
    <circle cx="24" cy="46" r="2.5" fill="#A855F7" />

    <!-- Hexagon body -->
    <polygon points="24,6 42,16 42,32 24,42 6,32 6,16" fill="#0E1626" stroke="url(#bb-grad-cyan)" stroke-width="2.5" filter="url(#neon-glow)" />

    <!-- Core 'B' / Binary Node -->
    <path d="M 18 16 L 26 16 C 29 16 30 18 30 20 C 30 21.5 29 23 27 23.5 C 29.5 24 30.5 26 30.5 28 C 30.5 30.5 28.5 32 25.5 32 L 18 32 Z" fill="none" stroke="url(#bb-grad-purple)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="18" y1="23.5" x2="26" y2="23.5" stroke="url(#bb-grad-purple)" stroke-width="2" />
    <circle cx="24" cy="24" r="1.5" fill="#00F2FE" />
  </g>

  <!-- Brand Typography -->
  <text x="64" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">
    Bengal<tspan fill="url(#bb-grad-cyan)">Bits</tspan>
  </text>
  <text x="65" y="47" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2.5" fill="#94A3B8">
    ROBOTORIAL • LABS
  </text>
</svg>
