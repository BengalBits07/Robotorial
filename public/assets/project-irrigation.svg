<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none" role="img" aria-label="Smart Plant Irrigation IoT System">
  <defs>
    <linearGradient id="soil-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="water-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="#0C1322" rx="12" />
  
  <!-- Soil Pot / Bed -->
  <path d="M 60 160 L 180 160 L 165 220 L 75 220 Z" fill="url(#soil-grad)" stroke="#475569" stroke-width="2" />
  
  <!-- Plant Sprout -->
  <path d="M 120 160 Q 120 120 135 110" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 135 110 Q 155 105 150 90 Q 135 95 135 110" fill="#10B981" />
  <path d="M 125 130 Q 105 125 110 110 Q 125 115 125 130" fill="#34D399" />

  <!-- Capacitive Moisture Sensor Probe inserted in soil -->
  <rect x="90" y="140" width="10" height="50" rx="2" fill="#D97706" stroke="#FBBF24" stroke-width="1.2" />
  <!-- Sensor wires leading to ESP8266 controller -->
  <path d="M 95 140 Q 95 80 230 75" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="3 3" fill="none" />

  <!-- ESP8266 Wi-Fi Microcontroller Unit -->
  <rect x="230" y="55" width="130" height="85" rx="8" fill="#1E293B" stroke="#00F2FE" stroke-width="2" />
  <!-- Wi-Fi Antenna trace -->
  <path d="M 325 65 L 345 65 L 345 75 L 335 75 L 335 85 L 345 85" stroke="#F59E0B" stroke-width="2" fill="none" />
  
  <!-- Microcontroller details -->
  <rect x="245" y="75" width="35" height="40" rx="3" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
  <text x="250" y="98" font-family="monospace" font-size="8" fill="#00F2FE">ESP8266</text>
  <circle cx="295" cy="80" r="3" fill="#10B981" />
  <circle cx="295" cy="92" r="3" fill="#38BDF8" />
  
  <text x="240" y="125" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Telemetry: MQTT over TLS</text>

  <!-- Water Submersible Pump & Pipe -->
  <rect x="230" y="170" width="45" height="35" rx="5" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" />
  <text x="237" y="192" font-family="system-ui, sans-serif" font-size="9" fill="#FFFFFF" font-weight="700">PUMP</text>
  <!-- Water Tube -->
  <path d="M 230 185 Q 160 185 140 145" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Water Drops -->
  <circle cx="140" cy="150" r="3" fill="#38BDF8">
    <animate attributeName="cy" values="145;165;145" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Live Telemetry Card -->
  <rect x="25" y="30" width="150" height="48" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="35" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#38BDF8" font-weight="700">SOIL MOISTURE: 68%</text>
  <text x="35" y="65" font-family="system-ui, sans-serif" font-size="9" fill="#10B981">Optimal Threshold: [55%-75%]</text>
</svg>
