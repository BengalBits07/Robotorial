<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%" fill="none" role="img" aria-label="Compact Autonomous Robotic System">
  <defs>
    <radialGradient id="sm-robot-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sm-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="225" rx="75" ry="12" fill="url(#sm-robot-shadow)" />

  <g transform="translate(10, 10)">
    <!-- Head / Eye Sensor -->
    <rect x="68" y="25" width="44" height="32" rx="8" fill="#1F2937" stroke="#4B5563" stroke-width="2" />
    <circle cx="82" cy="41" r="6" fill="#00F2FE" />
    <circle cx="98" cy="41" r="6" fill="#00F2FE" />
    <circle cx="82" cy="41" r="2" fill="#FFFFFF" />
    <circle cx="98" cy="41" r="2" fill="#FFFFFF" />

    <!-- Torso -->
    <rect x="52" y="62" width="76" height="65" rx="12" fill="url(#sm-body-grad)" stroke="#374151" stroke-width="2" />
    <circle cx="90" cy="94" r="14" fill="#111827" stroke="#FF6B00" stroke-width="2" />
    <polygon points="90,87 95,98 85,98" fill="#FF6B00" />

    <!-- Arms -->
    <rect x="36" y="68" width="12" height="42" rx="4" fill="#374151" />
    <rect x="132" y="68" width="12" height="42" rx="4" fill="#374151" />
    <circle cx="42" cy="115" r="5" fill="#FF6B00" />
    <circle cx="138" cy="115" r="5" fill="#FF6B00" />

    <!-- Pelvis -->
    <rect x="66" y="130" width="48" height="18" rx="4" fill="#1F2937" />

    <!-- Left Leg -->
    <rect x="60" y="148" width="16" height="42" rx="4" fill="#374151" />
    <circle cx="68" cy="172" r="4" fill="#FF6B00" />
    <rect x="52" y="195" width="28" height="14" rx="4" fill="#111827" stroke="#4B5563" stroke-width="1.5" />

    <!-- Right Leg -->
    <rect x="104" y="148" width="16" height="42" rx="4" fill="#374151" />
    <circle cx="112" cy="172" r="4" fill="#FF6B00" />
    <rect x="100" y="195" width="28" height="14" rx="4" fill="#111827" stroke="#4B5563" stroke-width="1.5" />
  </g>
</svg>
