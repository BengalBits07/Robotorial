<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none" role="img" aria-label="Portrait of Arup Banerjee, CTO & Mentor">
  <defs>
    <linearGradient id="avatar-bg-arup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="ring-arup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <clipPath id="circle-clip-arup">
      <circle cx="80" cy="80" r="70" />
    </clipPath>
  </defs>

  <circle cx="80" cy="80" r="76" stroke="url(#ring-arup)" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.85" />
  <circle cx="80" cy="80" r="70" fill="url(#avatar-bg-arup)" />

  <g clip-path="url(#circle-clip-arup)">
    <path d="M 20 80 L 50 110 L 90 110 L 120 140" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="3 3" />
    <circle cx="50" cy="110" r="2.5" fill="#10B981" opacity="0.5" />

    <!-- Shoulders & Tech Hoodie -->
    <path d="M 26 160 C 26 124 50 114 80 114 C 110 114 134 124 134 160 Z" fill="#0F172A" />
    <path d="M 68 116 L 80 142 L 92 116" stroke="#10B981" stroke-width="2" fill="none" opacity="0.7" />

    <!-- Neck & Face -->
    <rect x="72" y="92" width="16" height="24" rx="4" fill="#E2A67A" />
    <ellipse cx="80" cy="74" rx="26" ry="32" fill="#EBB48C" />

    <!-- Short tech cut hair -->
    <path d="M 52 68 C 50 44 60 30 80 30 C 100 30 110 44 108 68 C 104 50 100 38 80 38 C 60 38 56 50 52 68 Z" fill="#18181B" />
    <path d="M 54 44 C 64 34 84 32 106 38 C 104 32 94 28 80 28 C 66 28 58 34 54 44 Z" fill="#27272A" />

    <!-- Beard / stubble -->
    <path d="M 58 76 C 60 98 70 106 80 106 C 90 106 100 98 102 76 C 100 94 92 102 80 102 C 68 102 60 94 58 76 Z" fill="#27272A" opacity="0.7" />

    <!-- Eyes & Brows -->
    <circle cx="68" cy="72" r="2.5" fill="#1E293B" />
    <circle cx="92" cy="72" r="2.5" fill="#1E293B" />
    <line x1="62" y1="66" x2="74" y2="67" stroke="#18181B" stroke-width="2.2" stroke-linecap="round" />
    <line x1="86" y1="67" x2="98" y2="66" stroke="#18181B" stroke-width="2.2" stroke-linecap="round" />

    <!-- Smile -->
    <path d="M 73 88 Q 80 94 87 88" stroke="#9A3412" stroke-width="1.6" stroke-linecap="round" fill="none" />
  </g>

  <!-- Status indicator dot -->
  <circle cx="126" cy="126" r="10" fill="#0B0F19" />
  <circle cx="126" cy="126" r="7" fill="#06B6D4" />
</svg>
